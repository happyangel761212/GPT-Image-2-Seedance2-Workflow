name: Deploy AI Survey to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        working-directory: ai-survey-app
        run: npm install

      - name: Build
        working-directory: ai-survey-app
        env:
          GITHUB_PAGES: 'true'
          VITE_ADMIN_PASSWORD: ${{ secrets.VITE_ADMIN_PASSWORD || 'admin1234' }}
        run: npm run build

      - name: Copy 404 for SPA routing
        run: cp ai-survey-app/dist/index.html ai-survey-app/dist/404.html

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ai-survey-app/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
